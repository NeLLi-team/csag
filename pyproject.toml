[project]
name = "csag"
version = "1.0.0"
description = "Schema, validator, command-line tools, and worked examples for Conditional Scientific Argumentation Graphs (CSAG), a machine-readable representation of the argumentation structure of a scientific manuscript."
readme = "README.md"
authors = [{ name = "Frederik Schulz" }]
license = "BSD-3-Clause"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23.0",
  "PyYAML>=6.0",
  "pypdfium2>=4.30.0",
  "Pillow>=10.0.0",
  "rdflib>=7.0.0",
]

[project.urls]
Repository = "https://github.com/NeLLi-team/csag"
Documentation = "https://nelli-team.github.io/csag/"

[project.scripts]
csag = "csag.cli:main"

[project.optional-dependencies]
local-pdf = [
  "liteparse>=2,<3",
]
benchmark-schema = [
  "linkml==1.10.0",
  "pydantic-ai-slim[openrouter]>=1.0.0",
]

[dependency-groups]
dev = ["linkml==1.10.0", "PyLD>=2.0.4", "pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["csag"]

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "csag/data/LICENSE"
"README.md" = "csag/data/README.md"
"examples" = "csag/data/examples"
"scripts" = "csag/data/scripts"
"skills" = "csag/data/skills"
"supplementary" = "csag/data/supplementary"
